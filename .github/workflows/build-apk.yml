
name: Build Hadderni Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Initialize Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "حضّرني" "com.newstep.hadderni" --web-dir=www
          npx cap add android
      - name: Install Capacitor Assets
        run: npm install -D @capacitor/assets

      - name: Generate Android App Icons
        run: npx capacitor-assets generate --android
      - name: Configure Android SDK
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          echo "sdk.dir=$SDK_DIR" > android/local.properties
          yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true

      - name: Fix Kotlin dependency versions
        run: |
          cat >> android/build.gradle <<'EOF'

          subprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency {
                      if (requested.group == "org.jetbrains.kotlin" &&
                          requested.name.startsWith("kotlin-stdlib")) {
                          useVersion "1.8.22"
                      }
                  }
              }
          }
          EOF

      - name: Add Camera permission
        run: |
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          perm = "<uses-permission android:name=\"android.permission.CAMERA\" />\n"
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", perm + "    <application", 1)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hadderni-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
